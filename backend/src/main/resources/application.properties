server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartbiz?replicaSet=rs0}
spring.data.mongodb.auto-index-creation=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
smartbiz.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
smartbiz.seed=${SEED_DEMO:false}
