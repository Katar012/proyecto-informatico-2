services:
  mongo:
    image: mongo:8.0.17
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}); } if (!db.hello().isWritablePrimary) quit(1);'"
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
volumes:
  mongo-data:
